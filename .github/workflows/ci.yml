name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOMAXPROCS: '2'
      GOML_BUILD_JOBS: '2'
      GOML_TEST_JOBS: '2'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.40.0'
      - name: Select reference Go
        run: printf 'GOMLGO_GO=%s\n' "$(command -v go)" >> "$GITHUB_ENV"
      - name: Install released GoML
        run: just toolchain
      - name: Verify standalone project
        run: |
          mkdir -p _artifact/ci
          set -o pipefail
          just ci 2>&1 | tee _artifact/ci/verification.log
      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gomlgo-verification
          path: |
            _artifact/ci/
            _artifact/smoke/
            _artifact/gomlgo-diff/failures/
            _artifact/gomlgo-type-diff/failures/
          if-no-files-found: ignore
          retention-days: 14
